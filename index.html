;if(l.weight>p.weight)p.weight=l.weight;if(l.reps>p.bestReps){p.bestReps=l.reps;p.repsWeight=l.weight}let estimate=l.weight*(1+l.reps/30);if(estimate>p.oneRM)p.oneRM=estimate;prs[l.exercise]=p});return shell(`<div class="eyebrow">Every session adds up</div><h1>Your progress</h1><p class="muted">A look at the work you’ve put in.</p><div class="progress-top"><div class="card"><div class="eyebrow">Workout days</div><div class="progress-number">${unique.length}</div><span class="muted">all time</span></div><div class="card"><div class="eyebrow">Day streak</div><div class="progress-number">${streak()} 🔥</div><span class="muted">consecutive days</span></div><div class="card"><div class="eyebrow">Total volume</div><div class="progress-number">${Math.round(displayWeight(kg)).toLocaleString()} <small style="font-size:13px">${state.unit||'kg'}</small></div><span class="muted">${sessions} sessions logged</span></div></div><section class="card" style="margin-top:17px"><div class="eyebrow">Consistency</div><h2>Last 7 days</h2><div class="week-strip">${week.map((d,i)=>`<div class="week-day">${['M','T','W','T','F','S','S'][i]}<b class="${state.logs.some(l=>l.date===d)?'done':''}">${new Date(d+'T12:00:00').getDate()}</b></div>`).join('')}</div></section><section class="card" style="margin-top:17px"><div class="eyebrow">Training volume</div><h2>This week by muscle</h2><p class="muted">Weight × reps × sets, from Monday onward.</p><div class="records" style="margin-top:14px">${Object.entries(muscleVolume).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="record"><strong>${esc(m)}</strong><strong>${Math.round(displayWeight(v)).toLocaleString()} ${state.unit||'kg'}</strong></div>`).join('')||'<div class="empty">Log a set to see your weekly muscle volume.</div>'}</div></section><section class="card" style="margin-top:17px"><div class="eyebrow">Top lifts</div><h2>Personal records</h2><div class="records" style="margin-top:14px">${Object.entries(prs).sort((a,b)=>b[1].oneRM-a[1].oneRM).slice function timerStart(){timerStop();timerSecs=90;timerPaused=false;document.getElementById('timer').classList.add('show');tickTimer();timerId=setInterval(()=>{if(!timerPaused){timerSecs--;tickTimer();if(timerSecs<=0){timerStop();toast('Rest complete. Ready for your next set?')}}},1000)}function tickTimer(){document.getElementById('timerText').textContent=`${String(Math.floor(timerSecs/60)).padStart(2,'0')}:${String(timerSecs%60).padStart(2,'0')}`}function timerToggle(){timerPaused=!timerPaused;document.getElementById('timerControl').textContent=timerPaused?'Resume':'Pause'}function timerStop(){clearInterval(timerId);timerId=null;document.getElementById('timer').classList.remove('show')}function drawChart(){let cvs=document.getElementById('chart');if(!cvs)return;let data=getLogsFor(view.name).slice().reverse().map(x=>({...x,weight:displayWeight(x.weight)}));let w=cvs.clientWidth||360,h=cvs.clientHeight||210,dpr=devicePixelRatio||1;cvs.width=w*dpr;cvs.height=h*dpr;let c=cvs.getContext('2d');c.scale(dpr,dpr);let style=getComputedStyle(document.body),grid=style.getPropertyValue('--line'),ink=style.getPropertyValue('--muted'),accent='#9bd94b',pad={l:38,r:10,t:13,b:28};c.font='11px system-ui';if(!data.length){c.fillStyle=ink;c.textAlign='center';c.fillText('Log a session to see your chart',w/2,h/2);return}let min=Math.min(...data.map(x=>x.weight)),max=Math.max(...data.map(x=>x.weight));if(min===max){min=Math.max(0,min-5);max=max+5}let X=i=>pad.l+(data.length===1?.5:i/(data.length-1))*(w-pad.l-pad.r),Y=v=>pad.t+(max-v)/(max-min)*(h-pad.t-pad.b);c.strokeStyle=grid;c.fillStyle=ink;c.textAlign='right';for(let i=0;i<4;i++){let v=min+(max-min)*i/3,y=Y(v);c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(v.toFixed(1),pad.l-7,y+4)}c.strokeStyle=accent;c.lineWidth=3;c.lineJoin='round';c.beginPath();data.forEach((d,i)=>i?c.lineTo(X(i),Y(d.weight)):c.moveTo(X(i),Y(d.weight)));c.stroke();data.forEach((d,i)=>{c.fillStyle=accent;c.beginPath();c.arc(X(i),Y(d.weight),4,0,Math.PI*2);c.fill()});c.textAlign='center';c.fillStyle=ink;[0,data.length-1].forEach(i=>{let lab=new Date(data[i].date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});c.fillText(lab,X(i),h-5)})}window.addEventListener('resize',()=>view.page==='exercise'&&drawChart());window.addEventListener('online',()=>{if(authUser)void retryCloud()});
function openCustom(){let days=state.custom||[['Monday','Push','Chest · Shoulders · Triceps'],['Tuesday','Pull','Back · Biceps'],['Wednesday','Rest','Recovery'],['Thursday','Legs','Quads · Hamstrings · Glutes'],['Friday','Rest','Recovery'],['Saturday','Rest','Recovery'],['Sunday','Rest','Recovery']];document.getElementById('modal').innerHTML=`<div class="modal"><div class="modal-head"><div><div class="eyebrow">Make it fit your week</div><h2>Build a custom split</h2></div><button class="modal-close" onclick="closeModal()">×</button></div><p class="muted" style="font-size:13px">Name each day and add the muscle groups you want to train. Use “Rest” for recovery days.</p><div id="customDays" class="custom-days">${days.map((d,i)=>customDay(d,i)).join('')}</div><button class="secondary" onclick="addCustomDay()">＋ Add day</button><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary lime" onclick="saveCustom()">Save split</button></div></div>`;document.getElementById('modal').classList.add('show')}function customDay(d,i){return `<div class="custom-day"><input class="day-name" value="${esc(d[0])}" placeholder="Day name"><input class="day-groups" value="${esc(d[1]==='Rest'?'Rest':d[2]||d[1])}" placeholder="Muscles or Rest"><button class="secondary" onclick="this.parentElement.remove()" aria-label="Remove day">×</button></div>`}function addCustomDay(){document.getElementById('customDays').insertAdjacentHTML('beforeend',customDay(['Day',''],0))}function saveCustom(){let names=[...document.querySelectorAll('.day-name')],groups=[...document.querySelectorAll('.day-groups')];let arr=names.map((x,i)=>{let g=groups[i].value.trim()||'Rest',rest=/^rest$/i.test(g);return [x.value.trim()||`Day ${i+1}`,rest?'Rest':'Workout',rest?'Recovery':g]});if(!arr.length){toast('Add at least one day');return}state.custom=arr;state.split='Custom';save();closeModal();render();toast('Custom split
